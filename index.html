<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的衣櫃">
<meta name="theme-color" content="#1a1a2e">
<title>我的衣櫃</title>
<style>
:root {
  --bg: #0f0f1a;
  --card: #1a1a2e;
  --card2: #16213e;
  --accent: #e94560;
  --accent2: #0f3460;
  --text: #eee;
  --text2: #aaa;
  --border: #2a2a4a;
  --success: #4ecca3;
  --warning: #f0a500;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

/* Header */
.header { background: var(--card); padding: 16px 16px 12px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

/* Stats */
.stats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.stats::-webkit-scrollbar { display: none; }
.stat { flex: 0 0 auto; background: var(--card2); border-radius: 10px; padding: 8px 12px; text-align: center; min-width: 60px; }
.stat .num { font-size: 18px; font-weight: 700; color: var(--accent); }
.stat .label { font-size: 10px; color: var(--text2); margin-top: 1px; }

/* Search */
.search-row { padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
#searchInput { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 15px; outline: none; }
#searchInput:focus { border-color: var(--accent); }

/* Filters */
.filters { padding: 0 16px 12px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn { padding: 7px 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 12px; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Grid */
.grid { padding: 8px 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

/* Card */
.card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s; }
.card:active { transform: scale(0.97); }
.card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 48px; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 10px; }
.card-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: 11px; color: var(--text2); margin-top: 3px; }
.card-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.card-tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: var(--card2); color: var(--text2); }

/* Empty */
.empty { text-align: center; padding: 60px 20px; }
.empty .icon { font-size: 64px; margin-bottom: 16px; }
.empty p { color: var(--text2); font-size: 14px; }

/* FAB */
.fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 28px; cursor: pointer; box-shadow: 0 4px 16px rgba(233,69,96,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; }
.fab:active { transform: scale(0.92); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; padding: 20px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-header h2 { font-size: 18px; }
.modal-close { font-size: 22px; cursor: pointer; color: var(--text2); padding: 4px 8px; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 15px; outline: none; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 60px; }

/* Cat Radio */
.cat-radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-radio-label { cursor: pointer; }
.cat-radio-input { display: none; }
.cat-radio-span { display: inline-block; padding: 9px 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 13px; transition: all 0.2s; }
.cat-radio-input:checked + .cat-radio-span { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Photo area */
.photo-area { width: 100%; aspect-ratio: 1; border-radius: 14px; border: 2px dashed var(--border); background: var(--card2); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
.photo-area .icon { font-size: 48px; margin-bottom: 8px; }
.photo-area .hint { font-size: 13px; color: var(--text2); }
.photo-area img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-area.has-photo .icon, .photo-area.has-photo .hint { display: none; }

/* Buttons */
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--card2); color: var(--text2); border: 1px solid var(--border); }
.btn-danger { background: #c0392b; color: #fff; }

/* Detail */
.detail-img { width: 100%; max-height: 360px; object-fit: contain; border-radius: 14px; background: var(--card2); margin-bottom: 14px; }
.detail-name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.detail-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.detail-tag { padding: 4px 10px; border-radius: 10px; background: var(--accent2); color: #fff; font-size: 12px; }
.detail-note { font-size: 14px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }
.detail-date { font-size: 12px; color: var(--text2); margin-top: 12px; opacity: 0.6; }

/* Backup bar */
.backup-bar { display: flex; gap: 8px; padding: 0 16px 8px; justify-content: flex-end; }
.backup-btn { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); font-size: 11px; cursor: pointer; }

/* Toast */
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--card); color: var(--text); padding: 12px 24px; border-radius: 12px; font-size: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 400; transition: transform 0.3s ease; border: 1px solid var(--border); }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Color dots */
.color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: middle; border: 1px solid rgba(255,255,255,0.2); }

/* ===== Outfit Tab ===== */
.tab-bar { display: flex; padding: 8px 16px 0; gap: 4px; }
.tab-btn { flex: 1; padding: 10px 0; border-radius: 12px 12px 0 0; border: 1px solid var(--border); border-bottom: none; background: var(--card2); color: var(--text2); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.tab-btn.active { background: var(--card); color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Outfit page */
#outfitTab { padding: 12px 16px; }
.outfit-canvas-wrap { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; position: relative; }
#outfitCanvas { width: 100%; max-width: 520px; border-radius: 12px; background: #0a0a15; touch-action: none; }
.outfit-avatar-area { width: 100%; max-width: 520px; margin-bottom: 12px; }
.outfit-avatar-preview { width: 100%; aspect-ratio: 3/4; border-radius: 14px; border: 2px dashed var(--border); background: var(--card2); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
.outfit-avatar-preview .icon { font-size: 48px; margin-bottom: 8px; }
.outfit-avatar-preview .hint { font-size: 13px; color: var(--text2); }
.outfit-avatar-preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.outfit-avatar-preview.has-photo .icon, .outfit-avatar-preview.has-photo .hint { display: none; }

/* Selected chips inside canvas area */
.outfit-selected-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0 4px; min-height: 32px; justify-content: center; }
.outfit-selected-chip { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 10px; background: var(--card2); border: 1px solid var(--border); font-size: 12px; }
.outfit-selected-chip .chip-emoji { font-size: 16px; }
.outfit-selected-chip .chip-label { max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outfit-selected-chip .chip-remove { cursor: pointer; color: var(--accent); font-size: 14px; margin-left: 2px; font-weight: bold; }

.outfit-section { margin-bottom: 12px; }
.outfit-section-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.outfit-items { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.outfit-items::-webkit-scrollbar { display: none; }
.outoutfit-item { flex: 0 0 72px; cursor: pointer; transition: transform 0.15s; }
.outoutfit-item:active { transform: scale(0.95); }
.outoutfit-item.selected { outline: 2px solid var(--accent); border-radius: 10px; }
.outoutfit-item .thumb { width: 72px; height: 72px; border-radius: 10px; background: var(--card2); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.outoutfit-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.outoutfit-item .name { font-size: 10px; color: var(--text2); text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outfit-actions { display: flex; gap: 8px; margin-top: 8px; }
.outfit-actions .btn { flex: 1; }
.outfit-empty { text-align: center; padding: 20px; color: var(--text2); font-size: 13px; }
</style>
</head>

<script>
const DB_NAME = 'WardrobeDB';
const DB_VERSION = 1;
const STORE_NAME = 'clothes';
const CAT_EMOJI = { top: '👕', bottom: '👖', dress: '👗', outer: '🧥', shoe: '👟', acc: '🎒' };
const CAT_LABEL = { top: '上衣', bottom: '褲子', dress: '裙子', outer: '外套', shoe: '鞋子', acc: '配件' };

let allClothes = [];
let currentFilter = 'all';
let currentSearch = '';
let detailId = null;

// ===== IndexedDB =====
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

function getAllClothes() {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = e => resolve(e.target.result || []);
    req.onerror = e => reject(e.target.error);
  });
}

function addCloth(cloth) {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.add(cloth);
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

function updateCloth(cloth) {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(cloth);
    req.onsuccess = e => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

function deleteCloth(id) {
  return new Promise(async (resolve, reject) => {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = e => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

// ===== Helpers =====
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Compress image to base64, max 800px, quality 0.7
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 800;
        let w = img.width, h = img.height;
        if (w > max || h > max) {
          if (w > h) { h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== Render =====
function render() {
  let items = [...allClothes];

  // Filter by category
  if (currentFilter !== 'all') {
    items = items.filter(c => c.cat === currentFilter);
  }

  // Search
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    items = items.filter(c => {
      const searchable = [c.color, c.brand, c.note, ...(c.tags || [])].join(' ').toLowerCase();
      return searchable.includes(q);
    });
  }

  // Stats
  document.getElementById('totalCount').textContent = allClothes.length;
  document.getElementById('topCount').textContent = allClothes.filter(c => c.cat === 'top').length;
  document.getElementById('bottomCount').textContent = allClothes.filter(c => c.cat === 'bottom').length;
  document.getElementById('dressCount').textContent = allClothes.filter(c => c.cat === 'dress').length;
  document.getElementById('outerCount').textContent = allClothes.filter(c => c.cat === 'outer').length;
  document.getElementById('shoeCount').textContent = allClothes.filter(c => c.cat === 'shoe').length;
  document.getElementById('accCount').textContent = allClothes.filter(c => c.cat === 'acc').length;

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (items.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = items.map(c => {
    const imgHtml = c.photo
      ? `<img src="${c.photo}" alt="${escHtml(c.brand || '')}">`
      : `<span>${CAT_EMOJI[c.cat] || '👕'}</span>`;
    const tagsHtml = (c.tags || []).slice(0, 3).map(t =>
      `<span class="card-tag">${escHtml(t)}</span>`
    ).join('');

    return `
      <div class="card" data-id="${c.id}">
        <div class="card-img">${imgHtml}</div>
        <div class="card-body">
          <div class="card-name">${escHtml(c.brand || CAT_LABEL[c.cat])}</div>

        </div>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => showDetail(parseInt(card.dataset.id)));
  });
}

// ===== Backup / Restore =====
async function doBackup() {
  if (!allClothes.length) { showToast('沒有資料可備份'); return; }
  const data = JSON.stringify(allClothes, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wardrobe-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`✅ 已備份 ${allClothes.length} 筆資料`);
}

async function doRestore(file) {
  try {
    const text = await file.text();
    const items = JSON.parse(text);
    if (!Array.isArray(items) || !items.length) { showToast('❌ 檔案格式錯誤'); return; }
    if (allClothes.length > 0) {
      if (!confirm(`目前有 ${allClothes.length} 筆資料，匯入將覆蓋全部 ${items.length} 筆。確定繼續？`)) return;
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    }
    for (let i = 0; i < items.length; i += 50) {
      const batch = items.slice(i, i + 50);
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      for (const item of batch) {
        const { id, ...rest } = item;
        store.add(rest);
      }
      await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
    }
    allClothes = await getAllClothes();
    showToast(`✅ 已匯入 ${items.length} 筆資料`);
    render();
  } catch (err) {
    showToast('❌ 匯入失敗');
  }
}

  const file = e.target.files[0];
  if (file) { doRestore(file); e.target.value = ''; }
});

    drawOutfit();
  } catch(err) { showToast('❌ 照片處理失敗'); }

function compressImageRaw(file, maxPx) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  renderSelectedChips();

function toggleOutfitItem(cat, id) {
  // For dress: exclusive (dress replaces top+bottom)
  if (cat === 'dress') {
    if (outfitSelections.dress && outfitSelections.dress.id === id) {
      outfitSelections.dress = null;
    } else {
      outfitSelections.dress = allClothes.find(c => c.id === id) || null;
      outfitSelections.top = null;
      outfitSelections.bottom = null;
    }
  } else if (cat === 'top' || cat === 'bottom') {
    if (outfitSelections.dress) outfitSelections.dress = null;
    if (outfitSelections[cat] && outfitSelections[cat].id === id) {
      outfitSelections[cat] = null;
    } else {
      outfitSelections[cat] = allClothes.find(c => c.id === id) || null;
    }
  } else {
    if (outfitSelections[cat] && outfitSelections[cat].id === id) {
      outfitSelections[cat] = null;
    } else {
      outfitSelections[cat] = allClothes.find(c => c.id === id) || null;
    }
  }
  renderOutfitItems();
}

function renderSelectedChips() {
  const container = document.getElementById('outfitSelectedBar');
  const chips = [];
  CAT_SLOTS.forEach(slot => {
    const item = outfitSelections[slot];

    const thumbHtml = item.photo

    });
  });
}

// --- Canvas drawing (free drag + pinch-zoom) ---
const CW = 520, CH = 780;

// Each placed item: { slot, cloth, img, cx, cy, w, h, scale }
let placedItems = [];
let dragging = null;   // { placedIndex, pointerId, startMX, startMY, origCX, origCY }
let pinchStart = null;

// --- Load avatar image once ---
let _avatarImgCached = null;
function getAvatarImg() {
  if (!_avatarImgCached && avatarPhoto) {
    _avatarImgCached = new Image();
    _avatarImgCached.src = avatarPhoto;
  }
  return _avatarImgCached;
}

function drawOutfit() {
  const canvas = document.getElementById('outfitCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, CW, CH);

  // Background
  ctx.fillStyle = '#0a0a15';
  ctx.fillRect(0, 0, CW, CH);

  // Avatar head (top portion of photo, circular clip)
  const avatarImg = getAvatarImg();
  if (avatarImg && avatarImg.complete && avatarImg.naturalWidth > 0) {
    const headR = 90;
    const headCX = CW / 2, headCY = 95;
    ctx.save();
    ctx.beginPath();
    ctx.arc(headCX, headCY, headR, 0, Math.PI * 2);
    ctx.clip();
    // Draw top portion of avatar (head area)
    const scale = (headR * 2) / avatarImg.width;
    const sx = 0, sy = 0;
    const sw = avatarImg.width, sh = avatarImg.width; // square crop from top
    const dw = sw * scale, dh = sh * scale;
    ctx.drawImage(avatarImg, sx, sy, sw, sh, headCX - headR, headCY - headR, dw, dh);
    ctx.restore();
    // Head outline
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(headCX, headCY, headR, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    // Placeholder head
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.arc(CW/2, 95, 90, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw placed clothes (bottom to top order)
  placedItems.forEach((p, i) => {
    if (!p.img || !p.img.complete) return;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.translate(p.cx, p.cy);
    ctx.scale(p.scale, p.scale);
    ctx.drawImage(p.img, -p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();

    // Selection border + buttons when selected
    if (i === selectedItem) {
      const bw = p.w * p.scale, bh = p.h * p.scale;
      const bx = p.cx - bw/2 - 2, by = p.cy - bh/2 - 2;

      // Dashed border
      ctx.strokeStyle = 'rgba(233,69,96,0.7)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 3]);
      ctx.strokeRect(bx, by, bw + 4, bh + 4);
      ctx.setLineDash([]);

      // --- Remove ✕ button (just outside top-right corner) ---
      const xR = 14;
      const xCX = p.cx + bw/2 + 8;
      const xCY = p.cy - bh/2 - 8;
      p._xCX = xCX;
      p._xCY = xCY;
      p._xR = xR;

      ctx.fillStyle = '#e94560';
      ctx.beginPath(); ctx.arc(xCX, xCY, xR, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      const pd = 4;
      ctx.beginPath(); ctx.moveTo(xCX-pd, xCY-pd); ctx.lineTo(xCX+pd, xCY+pd); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xCX+pd, xCY-pd); ctx.lineTo(xCX-pd, xCY+pd); ctx.stroke();

      // --- Scale knob (just outside bottom-right corner) ---
      const knobR = 24;
      const knobCX = p.cx + bw/2 + 10;
      const knobCY = p.cy + bh/2 + 10;
      p._knobCX = knobCX;
      p._knobCY = knobCY;
      p._knobR = knobR;

      // Knob outer ring
      ctx.strokeStyle = 'rgba(233,69,96,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(knobCX, knobCY, knobR, 0, Math.PI * 2); ctx.stroke();
      // Knob fill
      ctx.fillStyle = 'rgba(233,69,96,0.8)';
      ctx.beginPath(); ctx.arc(knobCX, knobCY, knobR - 2, 0, Math.PI * 2); ctx.fill();
      // Rotation indicator line
      const rotAngle = p._knobAngle || 0;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(knobCX, knobCY);
      ctx.lineTo(knobCX + Math.cos(rotAngle) * (knobR - 5), knobCY + Math.sin(rotAngle) * (knobR - 5));
      ctx.stroke();
      // + / - labels
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+', knobCX - 8, knobCY - 8);
      ctx.fillText('-', knobCX + 8, knobCY + 8);
    } else {
      p._knobCX = null;
      p._xCX = null;
    }
  });

  // Instruction hint
  if (placedItems.length === 0 && !avatarPhoto) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('點上方上傳大頭貼 → 下方選衣服', CW/2, CH/2);
  }
}

// Hover tracking
let hoveredItem = -1;
let selectedItem = -1; // index of currently selected placedItem (shows ✕ button)

function hitTest(mx, my) {
  // Reverse order (top items first)
  for (let i = placedItems.length - 1; i >= 0; i--) {
    const p = placedItems[i];
    const hw = (p.w * p.scale) / 2, hh = (p.h * p.scale) / 2;
    if (mx >= p.cx - hw && mx <= p.cx + hw && my >= p.cy - hh && my <= p.cy + hh) return i;
  }
  return -1;
}

function canvasCoords(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  if (e.touches) {
    const t = e.touches[0];
    return { mx: (t.clientX - rect.left) * scaleX, my: (t.clientY - rect.top) * scaleY };
  }
  return { mx: (e.clientX - rect.left) * scaleX, my: (e.clientY - rect.top) * scaleY };
}

function touchDist(e) {
  if (e.touches.length < 2) return 0;
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

const outfitCanvas = document.getElementById('outfitCanvas');

// Knob state: { placedIndex, startAngle, startScale, lastAngle, mode: 'knob' }
let knobMode = null;

// Use pointer events (works for both touch and mouse)
outfitCanvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const { mx, my } = canvasCoords(e, outfitCanvas);
  const idx = hitTest(mx, my);

  if (idx >= 0) {
    const p = placedItems[idx];

    // If already selected, check button hits first
    if (idx === selectedItem) {
      // Check ✕ button (top-right)
      if (p._xCX != null) {
        const dx = mx - p._xCX, dy = my - p._xCY;
        if (Math.sqrt(dx*dx + dy*dy) <= p._xR + 10) {
          // Remove this item
          const removedSlot = p.slot;
          placedItems.splice(idx, 1);
          outfitSelections[removedSlot] = null;
          selectedItem = -1;
          renderOutfitItems();
          drawOutfit();
          return;
        }
      }
      // Check knob (bottom-right)
      if (p._knobCX != null) {
        const dx = mx - p._knobCX, dy = my - p._knobCY;
        if (Math.sqrt(dx*dx + dy*dy) <= p._knobR + 12) {
          knobMode = {
            placedIndex: idx,
            startScale: p.scale,
            lastAngle: Math.atan2(my - p._knobCY, mx - p._knobCX),
            lastMX: mx,
            lastMY: my,
            pointerId: e.pointerId,
          };
          dragging = null;
          outfitCanvas.setPointerCapture(e.pointerId);
          drawOutfit();
          return;
        }
      }
    }

    // Select this item (bring to front)
    placedItems.push(placedItems.splice(idx, 1)[0]);
    selectedItem = placedItems.length - 1;

    // Start drag
    const fp = placedItems[selectedItem];
    dragging = { placedIndex: selectedItem, pointerId: e.pointerId, startMX: mx, startMY: my, origCX: fp.cx, origCY: fp.cy };
    outfitCanvas.setPointerCapture(e.pointerId);
    drawOutfit();
  } else {
    selectedItem = -1;
    drawOutfit();
  }
});

outfitCanvas.addEventListener('pointermove', e => {
  // Knob mode: horizontal drag + rotation
  if (knobMode && e.pointerId === knobMode.pointerId) {
    const p = placedItems[knobMode.placedIndex];
    if (!p) { knobMode = null; return; }
    const { mx, my } = canvasCoords(e, outfitCanvas);

    // Horizontal drag: right = zoom in, left = zoom out
    const hdx = mx - knobMode.lastMX;
    // Rotation angle change
    const angle = Math.atan2(my - p._knobCY, mx - p._knobCX);
    let delta = angle - knobMode.lastAngle;
    if (delta > Math.PI) delta -= Math.PI * 2;
    if (delta < -Math.PI) delta += Math.PI * 2;

    // Scale from horizontal drag (primary) + rotation (secondary)
    // Right drag = zoom in (+), CCW rotation = zoom in (+)
    const scaleDelta = hdx * 0.008 + delta * 0.4;
    p.scale = Math.max(0.2, Math.min(5, p.scale + scaleDelta));

    // Update knob visual rotation angle (accumulate)
    p._knobAngle = (p._knobAngle || 0) + delta;

    knobMode.lastMX = mx;
    knobMode.lastAngle = angle;
    drawOutfit();
    return;
  }

  if (!dragging || e.pointerId !== dragging.pointerId) return;
  const { mx, my } = canvasCoords(e, outfitCanvas);
  const dx = mx - dragging.startMX;
  const dy = my - dragging.startMY;
  const p = placedItems[dragging.placedIndex];
  if (p) {
    p.cx = dragging.origCX + dx;
    p.cy = dragging.origCY + dy;
    drawOutfit();
  }
});

outfitCanvas.addEventListener('pointerup', e => {
  if (knobMode && e.pointerId === knobMode.pointerId) {
    knobMode = null;
    return;
  }
  if (dragging && e.pointerId === dragging.pointerId) {
    dragging = null;
    const { mx, my } = canvasCoords(e, outfitCanvas);
    hoveredItem = hitTest(mx, my);
    drawOutfit();
  }
});

// Pinch zoom via gesture events (iOS Safari)
outfitCanvas.addEventListener('gesturestart', e => { e.preventDefault(); }, { passive: false });
outfitCanvas.addEventListener('gesturechange', e => {
  e.preventDefault();
  if (hoveredItem >= 0 && hoveredItem < placedItems.length) {
    const p = placedItems[hoveredItem];
    p.scale = Math.max(0.2, Math.min(4, e.scale));
    drawOutfit();
  }
}, { passive: false });
outfitCanvas.addEventListener('gestureend', () => {});

// --- Place a clothing item ---
function placeClothItem(cloth) {
  if (!cloth.photo) return;
  const img = new Image();
  img.onload = () => {
    // Default size: 180px wide, maintain aspect
    const defW = 180;
    const defH = (img.height / img.width) * defW;
    placedItems.push({
      slot: cloth.cat,
      cloth: cloth,
      img: img,
      cx: CW / 2,
      cy: CH * 0.45,
      w: defW,
      h: defH,
      scale: 1,
      rotation: 0,
    });
    drawOutfit();
  };
  img.src = cloth.photo;
}

// Override toggleOutfitItem to place on canvas
const origToggleOutfitItem = toggleOutfitItem;
toggleOutfitItem = function(cat, id) {
  if (cat === 'dress') {
    if (outfitSelections.dress && outfitSelections.dress.id === id) {
      outfitSelections.dress = null;
      removePlacedBySlot('dress');
    } else {
      outfitSelections.dress = allClothes.find(c => c.id === id) || null;
      outfitSelections.top = null;
      outfitSelections.bottom = null;
      removePlacedBySlot('top');
      removePlacedBySlot('bottom');
      if (outfitSelections.dress) placeClothItem(outfitSelections.dress);
    }
  } else if (cat === 'top' || cat === 'bottom') {
    if (outfitSelections.dress) { outfitSelections.dress = null; removePlacedBySlot('dress'); }
    if (outfitSelections[cat] && outfitSelections[cat].id === id) {
      outfitSelections[cat] = null;
      removePlacedBySlot(cat);
    } else {
      outfitSelections[cat] = allClothes.find(c => c.id === id) || null;
      if (outfitSelections[cat]) placeClothItem(outfitSelections[cat]);
    }
  } else {
    if (outfitSelections[cat] && outfitSelections[cat].id === id) {
      outfitSelections[cat] = null;
      removePlacedBySlot(cat);
    } else {
      outfitSelections[cat] = allClothes.find(c => c.id === id) || null;
      if (outfitSelections[cat]) placeClothItem(outfitSelections[cat]);
    }
  }
  renderOutfitItems();
};

function removePlacedBySlot(slot) {
  placedItems = placedItems.filter(p => p.slot !== slot);
  drawOutfit();
}

// --- Clear outfit ---
document.getElementById('outfitClearBtn').addEventListener('click', () => {
  CAT_SLOTS.forEach(s => outfitSelections[s] = null);
  placedItems = [];
  renderOutfitItems();
});

// --- Save outfit as image ---
document.getElementById('outfitSaveBtn').addEventListener('click', () => {
  const canvas = document.getElementById('outfitCanvas');
  try {
    // Draw at 2x resolution for higher quality
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = CW * 2;
    exportCanvas.height = CH * 2;
    const ctx = exportCanvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.drawImage(canvas, 0, 0);
    const dataUrl = exportCanvas.toDataURL('image/jpeg', 0.9);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `outfit-${new Date().toISOString().slice(0,10)}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('✅ 已儲存穿搭圖片');
  } catch(e) {
    showToast('❌ 儲存失敗');
  }
});
</script>
